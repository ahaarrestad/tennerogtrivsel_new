# Midlertidige unntak for kjente sårbarheter som ikke har noen fiks ennå.
# Én liste for begge sjekkene i scheduled-audit.yml: OSV-scanneren (--config) og
# .github/scripts/npm-audit-check.sh. Hvert unntak MÅ ha ignoreUntil = YYYY-MM-DD.
# Etter datoen varsler begge igjen. Forleng bare etter ny vurdering.
# id må være GHSA-id-en i doble anførselstegn (det npm-skriptet matcher på).
#
# Ingen aktive unntak. Format:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "Hvorfor funnet ikke kan utnyttes her, og hvorfor det ikke kan fikses nå."
