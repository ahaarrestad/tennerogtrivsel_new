name: Auto-Rebase Open PRs

# Holder åpne PR-er à jour med main, som branch protection krever (`strict`).
# Logikken ligger i .github/scripts/dependabot-rebase.sh (testet i
# scripts/__tests__/dependabot-rebase.test.mjs). Spec: docs/designs/2026-10-24-rebase-retry.md
#
# - push til main: ett forsøk på alle åpne PR-er. Dependabot-PR-er får
#   `@dependabot rebase`, andre oppdateres med update-branch.
# - hver time: auto-merge-PR-er som fortsatt står BEHIND (og main er minst
#   30 min gammel) får nytt forsøk. Har Dependabot ikke svart på to kommentarer
#   siden head-commiten, eskaleres det til update-branch. Det er trygt fordi
#   auto-merge allerede er på: problemet i PR #472 (fetch-metadata nekter en
#   usignert commit) gjelder bare før auto-merge er slått på. Ulempen er at
#   Dependabot slutter å vedlikeholde PR-en, men den merges straks.
#   Dependabot rebaser ikke av seg selv når en PR bare er BEHIND.
#
# PAT og ikke GITHUB_TOKEN: Dependabot ser ut til å ta kommandoer bare fra brukere
# med skrivetilgang, og en oppdatering med GITHUB_TOKEN trigger ikke CI. Fila har
# derfor ingen PR-trigger, og ingen PR-styrt tekst går inn i shell.
#
# Kjøringen er grønn også når den finner eller gjør noe; rød betyr at selve
# workflowen er ødelagt. Fastlåste PR-er varsles av stuck-pr-watch.yml.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Bare logg hva som ville skjedd'
        type: boolean
        default: false
      min_minutes:
        description: 'Minutter siden siste push / siste kommentar (0 for testing)'
        default: '30'

permissions:
  contents: read   # bare checkout av skriptet; alt mot API-et går via PAT

concurrency:
  # Egen gruppe per hendelse: en ventende kjøring i samme gruppe fortrenges av en nyere,
  # så en timeskjøring kunne ellers erstatte en ventende push-kjøring. Push og retry
  # kolliderer ikke i praksis: retry gjør ingenting mens mains siste commit er under 30 min.
  group: dependabot-rebase-${{ github.event_name }}

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Rebase open PRs
        run: bash .github/scripts/dependabot-rebase.sh
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
          GH_REPO: ${{ github.repository }}
          MODUS: ${{ github.event_name == 'push' && 'push' || 'retry' }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_MINUTES: ${{ inputs.min_minutes || '30' }}
