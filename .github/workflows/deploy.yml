name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [google_drive_update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Utleder Playwright-Docker-imaget fra den EKSAKTE versjonen i package-lock.json,
  # slik at container-nettleserne alltid matcher npm-pakken. Uten dette må image-taggen
  # bumpes manuelt i lås med hver `@playwright/test`-oppdatering — og drift gir kryptiske
  # «Executable doesn't exist»-feil der ALLE e2e-testene faller på én gang.
  resolve-playwright:
    if: github.event_name != 'repository_dispatch' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pw.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: pw
        name: Derive Playwright image tag from package-lock.json
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Fant ikke @playwright/test-versjon i package-lock.json" >&2
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"
          echo "Bruker Playwright-image: v${version}-noble"

  unit-tests:
    if: github.event_name != 'repository_dispatch' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test

  lint:
    if: github.event_name != 'repository_dispatch' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Run ESLint
        run: npm run lint

  type-check:
    if: github.event_name != 'repository_dispatch' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      # `astro check` trenger innhold + genererte typer: prisliste.json er gitignorert
      # og statisk importert, og `.astro/types.d.ts` genereres av `astro sync` (ikke av
      # check selv). Uten begge stiger feiltallet. Fixtures gir deterministisk innhold.
      - name: Seed test fixtures
        run: npm run seed:fixtures
      - name: Generate Astro types
        run: npx astro sync
      - name: Run astro check
        run: npm run check

  e2e-tests:
    needs: [resolve-playwright]
    if: github.event_name != 'repository_dispatch' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    # E2E-bygget bruker syntetiske fixtures (ikke live Drive), så service-account-
    # secretene for sync trengs ikke her. De PUBLIC_*-variablene beholdes fordi
    # admin-siden baker dem inn ved `astro build`.
    env:
      PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
      PUBLIC_GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      PUBLIC_GOOGLE_DRIVE_TJENESTER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_TJENESTER_FOLDER_ID }}
      PUBLIC_GOOGLE_DRIVE_MELDINGER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_MELDINGER_FOLDER_ID }}
      PUBLIC_GOOGLE_DRIVE_TANNLEGER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_TANNLEGER_FOLDER_ID }}
      PUBLIC_GOOGLE_DRIVE_BILDER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BILDER_FOLDER_ID }}
      PUBLIC_GOOGLE_API_KEY: ${{ secrets.PUBLIC_GOOGLE_API_KEY }}
    container:
      image: ${{ needs.resolve-playwright.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Verify npm package signatures
        run: npm audit signatures
      - name: Check for critical vulnerabilities
        run: npm audit --audit-level=critical

      # Seeder syntetiske fixtures i stedet for live Drive — gjør E2E uavhengig av
      # Google Drive-innhold. Dette bygget er KUN for testing og lastes IKKE opp som
      # deploy-artefakt (deploy-bygget skjer i build-jobben med ekte Drive-data).
      - name: Seed test fixtures
        run: npm run seed:fixtures

      - name: Build Astro site (fixtures)
        run: npm run build:ci

      # Fixtures-bygget gir samme inline-skript-hasher som prod-bygget (datadrevne
      # application/json-skript ekskluderes), så vi kan verifisere at den committede
      # src/generated/csp-hashes.json er i sync med kildekoden. Feiler hvis en utvikler
      # endret et inline-skript uten å regenerere og committe hash-fila.
      - name: Verify CSP hashes are in sync
        run: |
          # Playwright-imaget kjører som root mens checkout eier workspace som annen
          # UID — uten dette nekter git med «detected dubious ownership» (idempotent).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm run generate-csp-hashes
          git diff --exit-code src/generated/csp-hashes.json

      - name: Run E2E tests
        run: npx playwright test
        env:
          HOME: /root

  build:
    needs: [unit-tests, e2e-tests, lint, type-check]
    # Jobbnivå-permissions ERSTATTER toppnivå-settet for denne jobben. `issues: write`
    # trengs av rapporteringssteget under; `pages`/`id-token` brukes ikke her (kun av
    # deploy-jobben), så de utelates bevisst.
    permissions:
      contents: read
      issues: write
    # Bygger deploy-artefakten. Hoppes over på pull_request (deploy skjer aldri på PR,
    # og fork-PR-er mangler Drive-secrets) — PR-er dekkes av unit/e2e/lint/type-check-jobbene.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.type-check.result == 'success' || needs.type-check.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
      PUBLIC_GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      PUBLIC_GOOGLE_DRIVE_TJENESTER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_TJENESTER_FOLDER_ID }}
      PUBLIC_GOOGLE_DRIVE_MELDINGER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_MELDINGER_FOLDER_ID }}
      PUBLIC_GOOGLE_DRIVE_TANNLEGER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_TANNLEGER_FOLDER_ID }}
      PUBLIC_GOOGLE_DRIVE_BILDER_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BILDER_FOLDER_ID }}
      PUBLIC_GOOGLE_API_KEY: ${{ secrets.PUBLIC_GOOGLE_API_KEY }}
    # Bygger ALLTID deploy-artefakten fra ekte Drive-data (`npm run sync`), for både
    # normal push og repository_dispatch. E2E-jobben bygger separat fra fixtures og
    # laster ikke opp noe — slik at det aldri er syntetiske testdata som deployes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Verify npm package signatures
        run: npm audit signatures
      - name: Check for critical vulnerabilities
        id: audit
        # Blokkerer på push/PR, der avhengighetstreet faktisk kan endres. På
        # repository_dispatch er lockfilen byte-identisk med den som alt kjører i prod,
        # så en blokkering fjerner ingen sårbarhet — den hindrer bare at redaktøren får
        # publisert innhold. Funnet går ikke tapt: steget under rapporterer det.
        continue-on-error: ${{ github.event_name == 'repository_dispatch' }}
        # tee framfor å kjøre TEKST-auditen på nytt i rapporteringssteget: rapporten i
        # issuen blir da byte-identisk med det gaten faktisk så. (Avtrykket der beregnes
        # av et eget `--json`-kall — det er maskindata, ikke rapporten.)
        # PIPESTATUS er nødvendig: default-shellen er `bash -e` UTEN pipefail, så uten
        # dette ville tee-ens exit 0 skjult at auditen feilet, og gaten hadde sluttet å
        # gate i det hele tatt. Ingenting må inn mellom pipelinen og `exit` — neste
        # kommando overskriver PIPESTATUS.
        run: |
          npm audit --audit-level=critical 2>&1 | tee "$RUNNER_TEMP/audit.txt"
          exit ${PIPESTATUS[0]}

      - name: Rapporter avvik som ikke blokkerte deployen
        if: github.event_name == 'repository_dispatch' && steps.audit.outcome == 'failure'
        # Dette steget skal aldri kunne velte jobben det nettopp slapp gjennom. Et tapt
        # varsel er bedre enn en blokkert innholdsdeploy — funnet ligger uansett i
        # jobbsammendraget.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKETT: sikkerhet-auto
        run: |
          RAPPORT="$RUNNER_TEMP/audit.txt"

          {
            echo '### Kritisk npm-avvik — deployen ble IKKE stoppet'
            echo
            echo 'Lockfilen er uendret fra den som alt kjører i prod, så deployen fikk gå'
            echo 'gjennom med vilje. Avviket må likevel fikses.'
            echo
            echo '~~~'
            cat "$RAPPORT"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          # Avtrykk = settet av KRITISKE advisory-URL-er. Uten det ville avvik nummer to
          # forsvunnet: står det alt en åpen issue om avvik A, og avvik B dukker opp, skal
          # B varsles — ikke slukes av dedupen.
          #
          # Severity-filteret er nødvendig fordi `npm audit --json` alltid rapporterer HELE
          # treet; `--audit-level` styrer kun exit-koden. Uten filteret ville et nytt
          # `moderate`-avvik flippet avtrykket og utløst varsel om et kritisk sett som ikke
          # hadde endret seg.
          #
          # Feiler jq (ugyldig JSON), blir AVTRYKK tomt. Da varsles det uten markør, og
          # forrige avtrykk blir stående som fasit framfor å bli overskrevet med tull.
          AVTRYKK=$(npm audit --json 2>/dev/null | jq -rS '
            [.vulnerabilities[]?.via[]? | objects | select(.severity == "critical") | .url]
            | unique | join(",")') || AVTRYKK=''

          # Dedup på etikett, ikke tittel: titler redigeres under triage, og da ville
          # dedupen brutt stille og hver eneste innholdspublisering åpnet en ny issue.
          # Samme mønster som `blocked-upgrades-watch.yml`.
          gh label create "$ETIKETT" \
            --description "Automatisk varsel: avvik som ikke blokkerte en innholdsdeploy" \
            --color d93f0b --force

          # Feiler kallet, står LISTE igjen som tom liste og vi oppretter en ny issue.
          # Bevisst feilmodus: en duplikat-issue er bedre enn et tapt varsel. Merk at
          # `--limit 1` da gjør den eldste usynlig for dedupen — lukk den manuelt.
          LISTE=$(gh issue list --label "$ETIKETT" --state open --limit 1 --json number) || LISTE=''
          [ -n "$LISTE" ] || LISTE='[]'
          NUMMER=$(printf '%s' "$LISTE" | jq -r '.[0].number // empty')

          # Fasit-avtrykket er den SISTE markøren i kropp + kommentarer. Issue-kroppen
          # skrives aldri på nytt: den kan inneholde triage-notater et menneske har lagt
          # inn, og et nytt avvik skal legge seg på den historikken, ikke slette den.
          # `tr -d '\r'` fordi GitHubs web-editor lagrer kroppen med CRLF så snart noen
          # har redigert den — uten dette ville `$`-ankeret sluttet å matche, og dedupen
          # brutt stille nøyaktig når noen begynte å jobbe med issuen.
          FORRIGE=''
          if [ -n "$NUMMER" ]; then
            FORRIGE=$(gh issue view "$NUMMER" --json body,comments \
                        --jq '.body, .comments[].body' 2>/dev/null \
                      | tr -d '\r' \
                      | sed -n 's/^<!-- avtrykk: \(.*\) -->$/\1/p' \
                      | tail -n 1)
          fi

          if [ -n "$NUMMER" ] && [ -n "$AVTRYKK" ] && [ "$FORRIGE" = "$AVTRYKK" ]; then
            echo "Åpen issue #$NUMMER dekker allerede nøyaktig disse avvikene."
            exit 0
          fi

          KROPP="$RUNNER_TEMP/issue-body.md"
          {
            if [ -n "$AVTRYKK" ]; then echo "<!-- avtrykk: $AVTRYKK -->"; fi
            echo '`npm audit --audit-level=critical` fant kritiske avvik under en'
            echo 'innholdsdeploy (`repository_dispatch: google_drive_update`).'
            echo
            echo 'Deployen ble **ikke** stoppet, og det er tilsiktet: lockfilen er identisk'
            echo 'med den som alt kjører i prod, så en blokkering ville bare hindret'
            echo 'innholdspublisering uten å fjerne sårbarheten fra prod.'
            echo
            echo '**Slik lukkes dette:**'
            echo '1. `npm update <pakke>`, eller hev gulvet i `package.json` om det er for lavt'
            echo '2. Verifiser med `npm audit --audit-level=critical`'
            echo '3. Send inn via `/commit` — push-stien har fortsatt en blokkerende gate'
            echo '4. Lukk issuen. Lukkes den uten at avviket er fikset, åpnes en ny ved neste innholdsdeploy'
            echo
            echo "Kjøring: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '~~~'
            # GitHub avviser issue-kropper over 65 536 tegn, og et avvist kall her ville
            # betydd tapt varsel (steget har continue-on-error). Egen `echo` etterpå fordi
            # head kan kutte midt i en linje.
            head -c 50000 "$RAPPORT"
            echo
            echo '~~~'
          } > "$KROPP"

          if [ -n "$NUMMER" ]; then
            echo "Avvikssettet er endret siden issue #$NUMMER sist ble varslet — kommenterer."
            gh issue comment "$NUMMER" --body-file "$KROPP"
          else
            gh issue create --label "$ETIKETT" \
              --title "[sikkerhet] Kritisk npm-avvik oppdaget under innholdsdeploy" \
              --body-file "$KROPP"
          fi

      - name: Sync data
        run: npm run sync
      - name: Build Astro site
        run: npm run build:ci
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-output
          path: dist/

  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-output
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

#      - name: Deploy to S3 TEST-SE
#        run: |
#          # 1. Hashed assets — immutable (1 år)
#          aws s3 sync dist/_astro/ s3://test2.aarrestad.com-se/_astro/ --delete \
#            --cache-control "public, max-age=31536000, immutable"
#
#          # 2. Fonter — immutable (1 år, versjonert i filnavn)
#          aws s3 sync dist/fonts/ s3://test2.aarrestad.com-se/fonts/ \
#            --cache-control "public, max-age=31536000, immutable"
#
#          # 3. Alt annet (HTML, favicons, SW) — kort cache med revalidering
#          aws s3 sync dist/ s3://test2.aarrestad.com-se --delete \
#            --exclude "_astro/*" --exclude "fonts/*" \
#            --cache-control "public, max-age=3600, stale-while-revalidate=86400"
#
#      - name: Invalidate CloudFront cache TEST
#        run: |
#          aws cloudfront create-invalidation \
#            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_TEST }} \
#            --paths "/*"

      # Må kjøre FØR invalideringen av /* nedenfor. Invalideres cachen mens den gamle
      # funksjonen fortsatt er live, repopulerer trafikk i mellomtiden /tiles/* med
      # vannmerkede tiles fra CARTO — og de blir liggende i 180 dager (CARTO sender
      # max-age=15552000, som slår cache-policyens DefaultTTL). Steget er uavhengig av
      # bygget (leser kun scripts/*.js fra checkouten), så det legges først for å gi
      # publish-function maksimal tid til å propagere til edge før cachen tømmes.
      - name: Deploy CloudFront Functions
        run: node scripts/setup-cloudfront-functions.mjs
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}

      - name: Create IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY not set — skipping"
            exit 0
          fi
          if ! [[ "$INDEXNOW_KEY" =~ ^[a-f0-9]{32}$ ]]; then
            echo "INDEXNOW_KEY is not valid 32-char hex — skipping"
            exit 0
          fi
          echo -n "$INDEXNOW_KEY" > "dist/${INDEXNOW_KEY}.txt"

      - name: Generate CSP hashes from build output
        run: node scripts/generate-csp-hashes.mjs

      - name: Deploy to S3 PROD-SE
        run: |
          # 1. Hashed assets — immutable (1 år)
          aws s3 sync dist/_astro/ s3://tennerogtrivsel-se/_astro/ --delete \
            --cache-control "public, max-age=31536000, immutable"

          # 2. Fonter — immutable (1 år, versjonert i filnavn)
          aws s3 sync dist/fonts/ s3://tennerogtrivsel-se/fonts/ \
            --cache-control "public, max-age=31536000, immutable"

          # 3. Alt annet (HTML, favicons, SW) — kort cache med revalidering
          aws s3 sync dist/ s3://tennerogtrivsel-se --delete \
            --exclude "_astro/*" --exclude "fonts/*" \
            --cache-control "public, max-age=3600, stale-while-revalidate=86400"

      - name: Invalidate CloudFront cache PROD
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/*"

      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY not set — skipping"
            exit 0
          fi
          if ! [[ "$INDEXNOW_KEY" =~ ^[a-f0-9]{32}$ ]]; then
            echo "INDEXNOW_KEY is not valid 32-char hex — skipping"
            exit 0
          fi

          if [ ! -f dist/sitemap-0.xml ]; then
            echo "dist/sitemap-0.xml not found — skipping IndexNow"
            exit 0
          fi

          URLS=$(grep -oP '(?<=<loc>)[^<]+' dist/sitemap-0.xml | jq -R . | jq -s .) || { echo "URL extraction failed — skipping IndexNow"; exit 0; }

          if [ -z "$URLS" ] || [ "$URLS" = "[]" ]; then
            echo "No URLs found in sitemap — skipping IndexNow"
            exit 0
          fi

          URL_COUNT=$(echo "$URLS" | jq 'length')
          if [ "$URL_COUNT" -gt 10000 ]; then
            echo "URL count ($URL_COUNT) exceeds IndexNow limit of 10000 — sending first 10000"
            URLS=$(echo "$URLS" | jq '.[0:10000]')
          fi

          PAYLOAD=$(jq -n \
            --arg host "www.tennerogtrivsel.no" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://www.tennerogtrivsel.no/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          curl -Sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Update CloudFront CSP hashes
        run: node scripts/update-cloudfront-csp.mjs
        env:
          CLOUDFRONT_POLICY_ID: ${{ secrets.CLOUDFRONT_CSP_POLICY_ID }}

      # Andre invalidering, kun for tiles. Funksjons-steget kjører først i jobben, men
      # publish-function propagerer til edge asynkront og kan bruke lengre tid enn resten av
      # jobben. Rakk ikke den nye versjonen ut før `/*`-invalideringen over, ble cachen fylt
      # på nytt med vannmerkede tiles som blir liggende i 180 dager. Denne kjører sist og er
      # billig, og reduserer vinduet kraftig. Den lukker det ikke helt — varer propageringen
      # lenger enn hele jobben, kan vannmerkede tiles rekke å bli cachet også etter dette
      # steget, og da må /tiles/* invalideres manuelt.
      - name: Invalidate CloudFront tiles PROD
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/tiles/*"

  update-lambda:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      PUBLIC_GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Verify npm package signatures
        run: npm audit signatures
      - name: Check for critical vulnerabilities
        id: audit
        # Samme begrunnelse som i build-jobben. Rapporteringssteget ligger KUN der:
        # begge jobbene auditerer samme lockfile i samme kjøring, så en issue til
        # ville vært ren duplikatstøy.
        continue-on-error: ${{ github.event_name == 'repository_dispatch' }}
        run: npm audit --audit-level=critical

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy Lambda code
        working-directory: lambda/kontakt-form-handler
        run: |
          npm ci --omit=dev --ignore-scripts
          zip -r function.zip index.mjs node_modules/
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_KONTAKT_ARN }} \
            --zip-file fileb://function.zip \
            --region eu-north-1
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_KONTAKT_ARN }} \
            --region eu-north-1

      - name: Read kontaktEpost from Sheets
        id: kontakt-epost
        run: |
          EPOST=$(node scripts/read-kontakt-epost.mjs)
          echo "::add-mask::$EPOST"
          echo "value=$EPOST" >> $GITHUB_OUTPUT

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ secrets.LAMBDA_KONTAKT_ARN }} \
            --environment "Variables={KONTAKT_MOTTAKER_EPOST=${{ steps.kontakt-epost.outputs.value }},ORIGIN_VERIFY_SECRET=${{ secrets.ORIGIN_VERIFY_SECRET }},RATE_LIMIT_TABLE=kontakt-rate-limit,AWS_NODEJS_CONNECTION_REUSE_ENABLED=1}" \
            --region eu-north-1

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_KONTAKT_ARN }} \
            --region eu-north-1
