name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30 # analysen tar ~1 min; en hengende kjøring feiler etter 30 min i stedet for 6 t, men PR-en er blokkert (code scanning-regelen) til CodeQL kjøres på nytt
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript: app-/scriptkode. actions: GitHub Actions-workflows
        # (script injection, usikre triggere, ufiksede actions). actions-skanningen
        # var av siden 2026-02-15 — slått på igjen her.
        language: [ javascript-typescript, actions ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
      with:
        languages: ${{ matrix.language }}
        config: |
          paths-ignore:
            - 'node_modules'
            - 'dist'
            - 'tests'
            - '**/__tests__'
            - 'coverage'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
      with:
        category: "/language:${{ matrix.language }}"
