name: Dependabot Auto-Merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Security-PR-er kjennes på gruppen (`*security-updates` i dependabot.yml).
      # `alert-state` er tom uten `alert-lookup: true` + token med alert-tilgang, så den
      # alene fanger dem ikke — den er med som ekstra sikring.
      #
      # Versjonsoppdateringer: alt unntatt major. Security-oppdateringer: kun patch —
      # de er forbi cooldown, men en patch-fiks er lav risiko. `ci-ok` (påkrevd sjekk)
      # må uansett være grønn før merge.
      - name: Approve and Enable Auto-Merge
        if: >-
          (!endsWith(steps.metadata.outputs.dependency-group, 'security-updates')
           && steps.metadata.outputs.alert-state == ''
           && steps.metadata.outputs.update-type != 'version-update:semver-major')
          || ((endsWith(steps.metadata.outputs.dependency-group, 'security-updates')
               || steps.metadata.outputs.alert-state != '')
           && steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}

      - name: Flag major updates for manual review
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major'
          && !endsWith(steps.metadata.outputs.dependency-group, 'security-updates')
          && steps.metadata.outputs.alert-state == ''
        run: |
          gh pr edit "$PR_URL" --add-assignee ahaarrestad || true
          gh pr edit "$PR_URL" --add-reviewer ahaarrestad || true
          gh pr comment "$PR_URL" --body "@ahaarrestad Auto-merge hoppet over — major-oppdatering (\`${DEPS}\`). Krever manuell review."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}

      - name: Flag security updates for manual review
        if: >-
          (endsWith(steps.metadata.outputs.dependency-group, 'security-updates')
           || steps.metadata.outputs.alert-state != '')
          && steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          gh pr edit "$PR_URL" --add-assignee ahaarrestad || true
          gh pr edit "$PR_URL" --add-reviewer ahaarrestad || true
          gh pr comment "$PR_URL" --body "@ahaarrestad Security-oppdatering (\`${DEPS}\`, ${UPDATE_TYPE}). Cooldown er omgått for CVE-fix, og det er ikke en patch-oppdatering — krever manuell review før merge."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
