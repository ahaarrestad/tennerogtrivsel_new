version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    rebase-strategy: auto
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # typescript@7 gjør lockfilen uløselig og feiler `npm ci` i alle CI-jobber.
      # To blokkeringer, begge uten TS 7-støtte per 2026-08-09:
      #   @astrojs/check@0.9.10   peer "^5.0.0 || ^6.0.0"
      #   typescript-eslint@8.65  peer ">=4.8.4 <6.1.0"  (støtte tracket mot TS >=7.1)
      # Begge har også runtime-vakter, så overrides/--legacy-peer-deps hjelper ikke.
      # Merk: ignore demper også security-updates. Skulle en CVE i typescript kun
      # være fikset i 7.x, kommer det ingen PR — alerten vises fortsatt i Security-
      # fanen, og må da håndteres manuelt.
      # Fjernes når blocked-upgrades-watch.yml åpner issue om at TS 7 er klart.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /lambda/kontakt-form-handler
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    rebase-strategy: auto
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      lambda-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      lambda-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Kun default-days her. github-actions har ingen semver-klassifisering i
    # dependabot, så semver-major/minor/patch-days avvises — og et avvist felt
    # ugyldiggjør HELE fila, ikke bare denne blokken. Da faller dependabot
    # tilbake på en tidligere konfigurasjon, og nye regler (som ignore for
    # typescript) trer stille aldri i kraft. Ikke «harmoniser» med npm-blokkene.
    cooldown:
      default-days: 7
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
